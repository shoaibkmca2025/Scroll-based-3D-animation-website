name: Build and deploy

# Every push and pull request is built, so a broken build never reaches main
# unnoticed. Pushes to main (or a manual run) then deploy to the VPS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: react
      - run: npm run build
        working-directory: react

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # one deploy at a time; a newer push waits rather than racing it
    concurrency:
      group: production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          # pinned host key, so the job refuses to talk to anything else
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server checkout is deploy-only: it is reset to exactly what
          # was pushed, then deploy.sh builds and publishes it.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            'cd ~/Grihive/Scroll-based-3D-animation-website && git fetch --quiet origin main && git reset --hard origin/main && bash deploy.sh'
