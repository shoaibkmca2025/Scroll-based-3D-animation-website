    <!-- Both faces are variable and loaded with real weights. The page asks for
         800 in a dozen places; without the real weight the browser synthesises
         it, which is what made those headings look soft.
         Fraunces carries its SOFT and WONK axes so the display face keeps its
         character — those axes only exist in the file if they are requested. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@40,1,9..144,400..900&family=Figtree:wght@400..900&display=swap"
    />
